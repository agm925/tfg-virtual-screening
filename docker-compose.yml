# Orquestación local/producción del TFG de cribado virtual.
# Uso:
#   docker compose up --build
#   docker compose up --build --scale worker=3   # varios workers Celery en paralelo
#
# Las variables se toman de un fichero ".env" en esta misma carpeta (ver .env.example).

x-backend-env: &backend-env
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
  DATABASE_URL: postgresql://${POSTGRES_USER:-tfg_user}:${POSTGRES_PASSWORD:-tfg_password}@db:5432/${POSTGRES_DB:-tfg_virtual_screening}
  REDIS_URL: redis://redis:6379/0
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
  EXECUTION_MODE: ${EXECUTION_MODE:-local}
  ALGORITMO_TIMEOUT: ${ALGORITMO_TIMEOUT:-1800}
  BANCO_SOCKET: /sock/banco.sock
  BATCH_TAMANO_BLOQUE: ${BATCH_TAMANO_BLOQUE:-25}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
  SLURM_HOST: ${SLURM_HOST:-bullxual.hpca.ual.es}
  SLURM_PORT: ${SLURM_PORT:-22}
  SLURM_USER: ${SLURM_USER:-}
  SLURM_SSH_KEY_PATH: ${SLURM_SSH_KEY_PATH:-}
  SLURM_PASSWORD: ${SLURM_PASSWORD:-}
  SLURM_REMOTE_DIR: ${SLURM_REMOTE_DIR:-}
  SLURM_PARTITION: ${SLURM_PARTITION:-generic}
  SLURM_TIME_LIMIT: ${SLURM_TIME_LIMIT:-00:30:00}
  SLURM_CPUS_PER_TASK: ${SLURM_CPUS_PER_TASK:-1}
  SLURM_MEM: ${SLURM_MEM:-4G}
  SLURM_MODULES: ${SLURM_MODULES:-}
  SLURM_CONDA_ENV: ${SLURM_CONDA_ENV:-}
  SLURM_ARRAY_THROTTLE: ${SLURM_ARRAY_THROTTLE:-0}
  SLURM_POLL_INTERVAL: ${SLURM_POLL_INTERVAL:-10}
  SLURM_JOB_TIMEOUT: ${SLURM_JOB_TIMEOUT:-3600}
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  EMAIL_FROM: ${EMAIL_FROM:-}

services:
  db:
    image: postgres:16
    container_name: tfg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tfg_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tfg_password}
      POSTGRES_DB: ${POSTGRES_DB:-tfg_virtual_screening}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Atado a 127.0.0.1: sigue siendo accesible desde el host (pgAdmin, psql,
      # DBeaver) pero deja de estar publicado a toda la red local, donde estaba
      # expuesto con la contraseña por defecto del compose.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tfg_user} -d ${POSTGRES_DB:-tfg_virtual_screening}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tfg_redis
    restart: unless-stopped
    ports:
      # Solo desde el host: Redis no tiene contraseña, y publicado a la red
      # cualquiera podría leer o borrar la cola de tareas.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tfg_backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    volumes:
      - ./uploads:/app/uploads
      - ./algoritmos:/app/algoritmos
      # Credenciales del cluster, en solo lectura y en un directorio aparte.
      # El entrypoint las instala en /root/.ssh con los permisos que exige
      # SSH (600): un bind mount desde Windows llega con permisos que el
      # cliente ssh rechaza por demasiado abiertos, y /root/.ssh no puede
      # montarse de solo lectura porque el propio entrypoint escribe ahi.
      # En modo local el directorio puede estar vacio: no se usa.
      #
      # Se monta DENTRO de /root, que es 700, y no en la raiz: desde Windows
      # llega con permisos 777, y los algoritmos corren como nobody (ver
      # app/ejecutor.py). En /ssh_ro cualquier algoritmo leia la clave privada
      # de tu cuenta del cluster; aqui ni siquiera puede entrar al directorio.
      - ${SLURM_SSH_DIR:-./secrets/ssh}:/root/ssh_montado:ro
      # Solo el socket del sandbox. El banco no ve ninguno de los otros dos.
      - banco_sock:/sock
    ports:
      - "8000:8000"
    # El backend tampoco tenia limite de memoria. Lo tenia el worker y no el
    # proceso web, que es el que atiende a los usuarios: una peticion que
    # consumiera toda la RAM se llevaba por delante la maquina entera.
    mem_limit: ${BACKEND_MEM_LIMIT:-2g}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      banco:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      <<: *backend-env
      # El worker no firma ni valida tokens: la clave de los JWT solo le
      # llegaba por compartir la plantilla con el backend.
      JWT_SECRET_KEY: ""
    volumes:
      - ./uploads:/app/uploads
      - ./algoritmos:/app/algoritmos
      # Credenciales del cluster, en solo lectura y en un directorio aparte.
      # El entrypoint las instala en /root/.ssh con los permisos que exige
      # SSH (600): un bind mount desde Windows llega con permisos que el
      # cliente ssh rechaza por demasiado abiertos, y /root/.ssh no puede
      # montarse de solo lectura porque el propio entrypoint escribe ahi.
      # En modo local el directorio puede estar vacio: no se usa.
      #
      # Se monta DENTRO de /root, que es 700, y no en la raiz: desde Windows
      # llega con permisos 777, y los algoritmos corren como nobody (ver
      # app/ejecutor.py). En /ssh_ro cualquier algoritmo leia la clave privada
      # de tu cuenta del cluster; aqui ni siquiera puede entrar al directorio.
      - ${SLURM_SSH_DIR:-./secrets/ssh}:/root/ssh_montado:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Sin container_name ni puertos publicados: necesario para poder escalar
    # con `docker compose up --scale worker=N` (varias réplicas en paralelo).
    #
    # Límite de memoria por worker. No convierte la ejecución de algoritmos en
    # un sandbox --subir un .py sigue siendo, por diseño, ejecutar código en el
    # servidor, y cualquier usuario registrado puede hacerlo-- pero sí
    # acota la consecuencia: un algoritmo que se desboque mata su propio worker
    # en vez de agotar la memoria de la máquina entera y llevarse por delante
    # la base de datos y la API. Con task_acks_late (app/celery_app.py), la
    # tarea interrumpida vuelve a la cola en lugar de perderse.
    mem_limit: ${WORKER_MEM_LIMIT:-2g}

  # --- Sandbox del banco de pruebas de algoritmos ---
  #
  # Aqui se ejecutan los algoritmos recien subidos para comprobarlos antes de
  # aceptarlos (ver app/banco_servidor.py). Es, por definicion, ejecutar codigo
  # que todavia no se ha aceptado, asi que este contenedor esta construido a
  # base de quitarle cosas:
  #
  #   · SIN volumenes. No monta ./uploads ni ./algoritmos, de modo que no ve
  #     ficheros de ningun usuario ni puede reescribir el catalogo. Las
  #     moleculas de referencia van horneadas en la imagen.
  #   · SIN el bloque *backend-env. No conoce JWT_SECRET_KEY --con la que
  #     podria firmarse un token de administrador--, ni DATABASE_URL, ni la
  #     contrasena del correo, ni las credenciales del cluster.
  #   · SIN RED, literalmente: network_mode "none" le deja solo el loopback.
  #     No tiene interfaz por la que salir a internet, ni por la que alcanzar
  #     PostgreSQL, Redis o la propia API del backend. La comunicacion con el
  #     backend va por un socket Unix en un volumen compartido, que es
  #     unidireccional en la practica: el backend abre la conexion y el banco
  #     solo responde.
  #   · SIN privilegios: usuario nobody, sistema de ficheros de solo lectura
  #     salvo un tmpfs, todas las capabilities retiradas y sin poder
  #     recuperarlas.
  #
  # Reutiliza la imagen del backend porque necesita la misma pila cientifica
  # (RDKit, Open Babel, smina) para poder ejecutar cualquier algoritmo del
  # catalogo; lo que cambia es el comando y todo lo que se le quita.
  banco:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # Deja fuera el catalogo de algoritmos: el sandbox no lo necesita y ahi
        # hay algoritmos privados de otros usuarios.
        PURGAR_CATALOGO: "1"
    container_name: tfg_banco
    restart: unless-stopped
    command: ["uvicorn", "app.banco_servidor:app", "--uds", "/sock/banco.sock"]
    environment:
      BANCO_TIMEOUT: ${BANCO_TIMEOUT:-120}
      MAX_ALGORITMO_KB: ${MAX_ALGORITMO_KB:-512}
      PYTHONUNBUFFERED: "1"
      HOME: /tmp
    network_mode: "none"
    user: "65534:65534"
    read_only: true
    volumes:
      # Unico punto de contacto con el resto del sistema. El directorio se crea
      # en la imagen con dueno 65534 para que uvicorn pueda crear ahi el socket
      # siendo nobody: un volumen con nombre hereda los permisos de la ruta que
      # exista en la imagen al crearse.
      - banco_sock:/sock
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: ${BANCO_MEM_LIMIT:-1g}
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket,sys; s=socket.socket(socket.AF_UNIX); s.settimeout(3); s.connect('/sock/banco.sock'); sys.exit(0)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  flower:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: tfg_flower
    restart: unless-stopped
    # Flower permite inspeccionar Y REVOCAR cualquier tarea, así que no puede
    # quedar abierto: se protege con usuario:contraseña (FLOWER_BASIC_AUTH en
    # .env) y además se ata a 127.0.0.1.
    command: >
      celery -A app.celery_app.celery_app flower --port=5555
      --basic_auth=${FLOWER_BASIC_AUTH:-admin:admin}
    environment:
      <<: *backend-env
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis

  # --- Simulación local del clúster bullx (perfil "slurm") ---
  #
  # No arrancan con `docker compose up` normal. Para levantarlos:
  #     docker compose --profile slurm up --build
  # con EXECUTION_MODE=slurm y SLURM_HOST=slurm en el .env (ver .env.example).
  #
  # Ojo a lo que NO hay aquí: el contenedor slurm no monta ./uploads. Es
  # deliberado. SlurmExecutor sube los ficheros por SFTP y se descarga los
  # resultados; compartir el volumen falsearía justo lo que se quiere simular,
  # que es el modelo copy-in/copy-out de un clúster real y sus modos de fallo.

  slurmdb:
    image: mariadb:11
    container_name: tfg_slurmdb
    profiles: ["slurm"]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: slurm_acct_db
      MARIADB_USER: slurm
      MARIADB_PASSWORD: slurm
      MARIADB_ROOT_PASSWORD: ${SLURM_DB_ROOT_PASSWORD:-root}
    volumes:
      - slurmdb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  slurm:
    build:
      context: .
      dockerfile: Dockerfile.slurm
      args:
        SLURM_SIM_USER: ${SLURM_USER:-tfg}
        SLURM_SIM_PASSWORD: ${SLURM_PASSWORD:-tfg}
    container_name: tfg_slurm
    profiles: ["slurm"]
    restart: unless-stopped
    # Tiene que coincidir con NodeName y SlurmctldHost de docker/slurm/slurm.conf.
    hostname: slurm
    depends_on:
      slurmdb:
        condition: service_healthy
    ports:
      # Solo desde el host, para poder entrar a inspeccionar la cola con
      # `ssh -p 2222 tfg@localhost` mientras depuras.
      - "127.0.0.1:2222:22"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: tfg_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db_data:
  slurmdb_data:
  # Solo contiene el socket Unix por el que el backend habla con el sandbox.
  banco_sock:
