# Demonio de accounting de SLURM. Necesario para que `sacct` devuelva estados:
# es la fuente que consulta app/slurm_executor.py::_esperar_finalizacion.
# El fichero debe pertenecer a SlurmUser y tener permisos 600, o slurmdbd
# se niega a arrancar (lo aplica el Dockerfile.slurm).

AuthType=auth/munge
DbdHost=localhost
DbdPort=6819

SlurmUser=slurm

DebugLevel=info
LogFile=/var/log/slurm/slurmdbd.log
PidFile=/run/slurmdbd.pid

# La base de datos vive en su propio contenedor (servicio "slurmdb" del compose).
StorageType=accounting_storage/mysql
StorageHost=slurmdb
StoragePort=3306
StorageUser=slurm
StoragePass=slurm
StorageLoc=slurm_acct_db
