# Configuración SLURM de un solo nodo para la simulación local de Picasso.
# NodeName tiene que coincidir con el hostname del contenedor: en
# docker-compose.yml el servicio fija "hostname: slurm".

ClusterName=tfgcluster
SlurmctldHost=slurm

SlurmUser=slurm
SlurmdUser=root

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid

AuthType=auth/munge
CryptoType=crypto/munge

# proctrack/linuxproc en vez de proctrack/cgroup: dentro de un contenedor,
# SLURM no controla la jerarquía de cgroups del host y slurmd no llega a
# arrancar. linuxproc rastrea los procesos por PPID, que basta para simular.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

# ReturnToService=2: si el nodo se marca DOWN al reiniciar el contenedor,
# vuelve solo a estado IDLE en vez de quedarse fuera para siempre.
ReturnToService=2
SlurmctldTimeout=60
SlurmdTimeout=60
InactiveLimit=0
# MinJobAge alto: los jobs terminados siguen consultables un rato, para que el
# sondeo de _esperar_finalizacion() no se quede sin información.
MinJobAge=300
KillWait=30
Waittime=0

# --- Accounting: es lo que hace que `sacct` devuelva algo ---
# app/slurm_executor.py sondea el estado con `sacct`, y sacct lee de la base de
# datos de accounting. Sin slurmdbd + MySQL detrás, devolvería vacío siempre.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=localhost
AccountingStoragePort=6819
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30

SlurmctldDebug=info
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdDebug=info
SlurmdLogFile=/var/log/slurm/slurmd.log

# RealMemory tiene que ser MENOR O IGUAL que la memoria que slurmd detecta en
# el contenedor. SLURM valida esto al registrar el nodo -- es independiente de
# TaskPlugin, que solo decide si además la fuerza durante la ejecución. Si se
# declara de más, el nodo entra en estado INVALID_REG con
# "Low RealMemory (reported:X < 100.00% of configured:Y)", queda en DRAIN y
# todos los jobs se quedan PENDING para siempre sin explicación aparente.
#
# 3000 MB es un valor conservador que registra bien en cualquier equipo de
# desarrollo. Como contrapartida, la simulación debe pedir menos de eso:
# .env.example fija SLURM_MEM=2G para el perfil slurm (el 4G que trae
# app/config.py por defecto sería rechazado en el sbatch por
# "requested node configuration is not available").
NodeName=slurm CPUs=2 RealMemory=3000 State=UNKNOWN

# El nombre de la partición debe casar con SLURM_PARTITION (app/config.py),
# cuyo valor por defecto es "generic".
PartitionName=generic Nodes=ALL Default=YES MaxTime=INFINITE State=UP
