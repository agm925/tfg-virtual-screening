server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En el servidor RTX la plataforma cuelga de https://rt.hpca.ual.es/molserver
    # (spec 004), detrás del proxy del grupo HPCA. Ese proxy puede reenviarnos
    # /molserver/x tal cual o quitarle el prefijo y mandarnos /x: no lo
    # controlamos, así que se aceptan las dos cosas. Si el prefijo llega, se
    # quita aquí y la petición sigue como si hubiera llegado a la raíz. Sin
    # proxy (desarrollo, localhost:5173) el prefijo no llega y nada cambia.
    rewrite ^/molserver/(.*)$ /$1 last;

    # Las redirecciones que haga nginx, con ruta relativa: detrás del proxy, una
    # absoluta llevaría el host y el puerto internos de este contenedor, que el
    # navegador no puede alcanzar.
    absolute_redirect off;

    # Sin la barra final, las rutas relativas de la página se resolverían fuera
    # de /molserver/.
    location = /molserver { return 301 /molserver/; }

    # La API se sirve bajo el mismo origen que la SPA.
    #
    # Antes el navegador hablaba directamente con http://localhost:8000, lo que
    # obligaba a hardcodear esa URL en el frontend (la app solo funcionaba en
    # localhost) y a abrir CORS de par en par en el backend. Sirviendo la API
    # bajo /api/ del mismo origen, ninguna de las dos cosas hace falta: no hay
    # petición cross-origin que permitir, y la SPA usa rutas relativas.
    #
    # La barra final de proxy_pass es significativa: hace que nginx quite el
    # prefijo /api/ antes de reenviar, de modo que /api/login llega al backend
    # como /login (que es la ruta que declara FastAPI).
    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Las bases de datos SDF pueden pesar cientos de MB; el límite por
        # defecto de nginx (1 MB) rechazaría la subida con un 413 antes de que
        # la petición llegase siquiera al backend.
        client_max_body_size 512M;

        # Las descargas de resultados y los listados grandes pueden tardar más
        # que los 60 s por defecto.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }

    # SPA: cualquier ruta que no sea un fichero existente cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
